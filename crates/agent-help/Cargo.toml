[package]
name = "agent-help"
version = "0.1.0"
description = "A CLI's help, written where each fact lives and assembled into one Markdown manual for an agent to read"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
agent-help-derive = { version = "0.1.0", path = "../agent-help-derive" }
clap = { version = "4.5", default-features = false, features = ["std"] }
flux-alloc.workspace = true
flux-core.workspace = true

[[example]]
name = "plans"
# Its test, `the_manual_is_whole`, runs with the crate's.
test = true

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
trybuild = "1"

# `cargo flux` (through ../../verify.sh) checks every function of this crate,
# and ../../gate.sh fails unless none is trusted or ignored.
[package.metadata.flux]
enabled = true
check_overflow = "strict"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flux)'] }
