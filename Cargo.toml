[workspace]
resolver = "3"
members = ["crates/agent-help", "crates/agent-help-derive", "crates/agent-help-flux"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/sunfmin/agent-cli"

# Flux, at the revision ./verify.sh's Flux, Homebrew's
# sunfmin/tap/flux-toolchain, was built from while its Flux checks this tree:
# `brew info sunfmin/tap/flux-toolchain` names it. Flux has no releases, and
# spec crates from another revision fail in ways that look like the crate's
# own bug.
[workspace.dependencies]
# Flux's refinements of the standard library: without them a slice has no
# length Flux knows of, and an index into one goes unchecked. Both are empty
# under a plain `cargo build`.
flux-alloc = { git = "https://github.com/flux-rs/flux.git", rev = "ef6af17f647cf98c860e18e90c36d1f1b69849ff" }
flux-core = { git = "https://github.com/flux-rs/flux.git", rev = "ef6af17f647cf98c860e18e90c36d1f1b69849ff" }
# A crate that writes specs adds `flux-rs`, the refinement attributes, here
# at the same revision.
