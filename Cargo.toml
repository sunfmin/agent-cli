[workspace]
resolver = "3"
members = ["crates/agent-help", "crates/agent-help-derive", "crates/agent-help-flux"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/sunfmin/agent-cli"

# Flux, pinned to the revision `cargo-flux` is built from: ./verify.sh refuses
# any other. Flux has no releases, and spec crates from another revision fail
# in ways that look like the crate's own bug.
[workspace.dependencies]
# Flux's refinements of the standard library: without them a slice has no
# length Flux knows of, and an index into one goes unchecked. Both are empty
# under a plain `cargo build`.
flux-alloc = { git = "https://github.com/flux-rs/flux.git", rev = "b2f3e31e17727ffe08c2efee1e7aa0bc4f0a66f9" }
flux-core = { git = "https://github.com/flux-rs/flux.git", rev = "b2f3e31e17727ffe08c2efee1e7aa0bc4f0a66f9" }
# A crate that writes specs adds `flux-rs`, the refinement attributes, here
# at the same revision; verify.sh reads the revision from `flux-core`.

# The rest of the checker ./verify.sh runs, beside the Flux revision above. It
# refuses any other: each value is what the tool reports about itself, to
# `fixpoint --version` and to `z3 --version`.
[workspace.metadata.checker]
fixpoint = "0.9.6.3.8 (684d0829c19fbee83b892c9f5e20c2598897297c)"
z3 = "5.1.0"
